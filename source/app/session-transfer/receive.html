<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Передача входа · LolzCloud</title><style nonce="{{NONCE}}">{{STYLE}}</style><main><small>LOLZCLOUD · SOUNDCLOUD</small><h1 id="heading">Сохраняем твой вход…</h1><section><p id="status" role="status" aria-live="polite">Подключаемся к открытому LolzCloud на этом компьютере.</p></section><p class="note">Эту вкладку можно закрыть после завершения.</p></main><script nonce="{{NONCE}}">(async()=>{const payload=location.hash.slice(1);history.replaceState(null,'',location.pathname);try{if(!payload)throw Error('Передача пуста. Нажми закладку на странице SoundCloud заново.');const envelope=JSON.parse(decodeURIComponent(payload));const result=await(await fetch('import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(envelope)})).json();if(!result.ok)throw Error(result.error||'Не удалось передать вход.');document.getElementById('heading').textContent=result.pendingChoice?'Выбери аккаунт в LolzCloud.':'Готово. Возвращайся к музыке.';document.getElementById('status').textContent=result.pendingChoice?'Аккаунт добавлен в список. Вернись в приложение и нажми на нужный аккаунт.':'Сессия сохранена в LolzCloud. Приложение проверит вход и откроет SoundCloud.';}catch(error){document.getElementById('heading').textContent='Передача не завершилась';document.getElementById('status').textContent=error.message;}})();</script></html>
