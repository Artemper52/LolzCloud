<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>LolzCloud · Мини-плеер</title><link rel="stylesheet" href="lib/css/lyrics.css"><link rel="stylesheet" href="lib/css/mini.css"><link rel="stylesheet" href="lib/css/mini-polish.css"><link rel="stylesheet" href="lib/css/controls.css"></head>
<body><div id="ambience" aria-hidden="true"><canvas id="mini-gradient"></canvas></div>
<header title="Перетащи мини-плеер в удобное место"><span>LOLZCLOUD</span><span class="mini-grip" aria-hidden="true">⠿</span><div><button id="open" title="Открыть студию" aria-label="Открыть студию">↗</button><button id="close" title="Закрыть мини-плеер" aria-label="Закрыть мини-плеер">×</button></div></header>
<main class="mini-track" title="Перетащи за обложку или название"><img id="cover" alt=""><div><h1 id="title">Включи любимый трек</h1><div class="mini-artist-line"><p id="artist">SoundCloud</p><small id="mini-tempo" class="mini-tempo" hidden></small></div></div></main>
<div class="mini-actions" role="group" aria-label="Оценка трека и повтор"><div class="mini-reactions"><button id="like" class="mini-action" aria-pressed="false" title="Добавить в понравившиеся SoundCloud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 5.7a4.8 4.8 0 0 0-6.8 0L12 7.2l-1.5-1.5a4.8 4.8 0 0 0-6.8 6.8L12 21l8.3-8.5a4.8 4.8 0 0 0 0-6.8Z"/></svg><span id="like-label">Нравится</span></button><button id="dislike" class="mini-action" hidden title="Не предлагать этот трек и включить следующий"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/></svg><span>Не нравится</span></button></div><div class="mini-secondary-actions"><button id="repeat" class="mini-action mini-repeat" aria-pressed="false" data-mode="off" title="Повтор выключен"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 3 4 4-4 4M3 11V9a2 2 0 0 1 2-2h16M7 21l-4-4 4-4m14 0v2a2 2 0 0 1-2 2H3"/></svg><span id="repeat-label">Повтор</span><b class="mini-repeat-one" aria-hidden="true">1</b></button><button id="download" class="mini-action mini-download" aria-label="Скачать песню в MP3" title="Скачать песню в MP3"><svg class="mini-download-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg><svg class="mini-download-done" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button></div></div>
<div class="mini-controls"><div id="mini-volume-control" class="mini-volume-control"><button id="volume-toggle" aria-label="Громкость" title="Громкость" aria-controls="mini-volume-popover" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3zm13-2a7 7 0 0 1 0 10v-2a5 5 0 0 0 0-6z"/></svg></button><div id="mini-volume-popover" class="mini-volume-popover"><label class="mini-volume"><input id="volume" type="range" aria-orientation="vertical" min="0" max="100" value="100" aria-label="Громкость мини-плеера"><output id="volume-label">100%</output></label></div></div><div class="mini-transport"><button id="previous" aria-label="Предыдущий трек"><svg viewBox="0 0 24 24"><path d="M5 5h3v14H5zm14 0L8 12l11 7z"/></svg></button><button id="playPause" aria-label="Пуск / пауза"><svg viewBox="0 0 24 24"><path id="play-icon" d="m8 5 11 7-11 7z"/></svg></button><button id="next" aria-label="Следующий трек"><svg viewBox="0 0 24 24"><path d="M16 5h3v14h-3zM5 5l11 7-11 7z"/></svg></button></div><div><button id="lyricsToggle" aria-pressed="false"><span class="mini-text-icon" aria-hidden="true">Т</span>Текст</button></div></div>
<div class="mini-timeline"><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Позиция в треке"><div><span id="position">0:00</span><span id="duration">0:00</span></div></div>
<p id="action-status" role="status" aria-live="polite"></p>
<section class="mini-words"><div><small id="lyric-status">СЛОВА ТВОЕЙ МУЗЫКИ</small><div class="lc-lyric-tools"><button id="follow" aria-pressed="true" title="Следовать за треком">↧</button><button id="fontDown" aria-label="Уменьшить текст">A−</button><button id="fontUp" aria-label="Увеличить текст">A+</button><button id="reloadLyrics" title="Обновить текст" aria-label="Обновить текст">↻</button></div></div><div id="lyrics"></div></section>
<script src="lib/js/artwork.js"></script><script src="lib/js/track-colors.js"></script><script src="lib/js/track-visuals.js"></script><script src="lib/js/wave-view.js"></script><script src="lib/js/lyrics-view.js"></script><script src="lib/js/range-controls.js"></script><script src="lib/js/mini.js"></script></body></html>
