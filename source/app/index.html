<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LolzCloud</title><link rel="stylesheet" href="lib/css/shell.css"><link rel="stylesheet" href="lib/css/lolzteam.css"><link rel="stylesheet" href="lib/css/features.css"><link rel="stylesheet" href="lib/css/lyrics.css"><link rel="stylesheet" href="lib/css/sound-lab.css"><link rel="stylesheet" href="lib/css/wave.css"><link rel="stylesheet" href="lib/css/shell-panels.css"><link rel="stylesheet" href="lib/css/shell-polish.css"><link rel="stylesheet" href="lib/css/studio-updates.css"><link rel="stylesheet" href="lib/css/controls.css"></head><body class="lolz-shell">
<header id="titlebar"><canvas id="titlebar-gradient" aria-hidden="true"></canvas><div class="window-controls"><button id="window-close" aria-label="Закрыть LolzCloud" title="Закрыть"></button><button id="window-minimize" aria-label="Свернуть" title="Свернуть"></button><button id="window-maximize" aria-label="Развернуть окно" title="Развернуть"></button></div><div class="browser-navigation"><button id="browser-back" aria-label="Назад">‹</button><button id="browser-forward" aria-label="Вперёд">›</button><button id="browser-reload" aria-label="Обновить SoundCloud">↻</button></div><strong id="page-title">SoundCloud</strong><div class="titlebar-right"><button id="artist-pro" title="Artist Pro на SoundCloud">Artist Pro ↗</button><span id="discord-indicator"></span>Discord</div></header>
<aside class="shell-sidebar"><div class="shell-brand"><img src="lib/assets/logo.svg" alt=""><div><strong>LolzCloud</strong><small>SOUNDCLOUD × LOLZTEAM</small></div></div><nav aria-label="Разделы LolzCloud"><small>ТВОЯ МУЗЫКА</small><button type="button" data-view="browser"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8v10h-6v-7H9v7H3z"/></svg></span>Обзор SoundCloud</button>
<button type="button" data-view="wave"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-10 5 10 9 0s6 10 9 0"/></svg></span>Моя волна</button>
<button type="button" data-view="library"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16M10 4v16m5-15 5 14"/></svg></span>Моя музыка</button>
<button type="button" data-view="community"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4z"/></svg></span>Подборки</button>
<button type="button" data-view="lyrics"><span aria-hidden="true"><span class="shell-text-icon">Т</span></span>Текст песни</button>
<button type="button" data-view="audio"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18M12 3v18M19 3v18"/><path d="M2 8h6m1 8h6m1-9h6"/></svg></span>Звук и эффекты</button>
<button type="button" data-view="room"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M2 21v-3c0-5 12-5 12 0v3m3-17a3 3 0 0 1 0 6m0 4c5 0 5 4 5 7"/></svg></span>Слушать вместе</button><button type="button" data-view="settings"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></span>Настройки</button></nav><div class="sidebar-bottom"><button id="open-mini">↗ Открыть мини-плеер</button><button id="open-account"><span id="account-avatar">L</span><span><strong id="account-name">Твой профиль</strong><small id="account-description">Подключить Lolzteam</small></span></button><div class="shell-profiles"><button id="lc-my-lolzteam" disabled>Lolzteam ↗</button><button id="lc-my-soundcloud" disabled>SoundCloud ↗</button></div></div></aside>
<main class="shell-browser"><webview id="webview" allowpopups></webview><div id="browser-loading">Подключаем SoundCloud…</div></main>
<footer class="shell-player"><canvas id="player-gradient" aria-hidden="true"></canvas><div class="shell-playing-track"><button id="player-track" title="Открыть карточку трека"><span class="shell-artwork"><span>♫</span><img id="player-cover" alt="" hidden></span><span><strong id="player-title">Выбери свой ритм</strong><small id="player-artist">Твоя музыка в LolzCloud</small></span></button><button id="player-like" class="shell-toggle" aria-label="Лайк" aria-pressed="false" title="Добавить в понравившиеся" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></button></div><div class="shell-transport"><div><span class="shell-repeat-spacer" aria-hidden="true"></span><button id="player-previous" aria-label="Предыдущий трек"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h3v14H5zm14 0L8 12l11 7z"/></svg></button><button id="player-playPause" aria-label="Продолжить"><svg viewBox="0 0 24 24"><path id="player-play-icon" d="m8 5 11 7-11 7z"/></svg></button><button id="player-next" aria-label="Следующий трек"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h3v14h-3zM5 5l11 7-11 7z"/></svg></button><button id="player-repeat" class="shell-toggle" aria-label="Повтор выключен" aria-pressed="false" title="Включить повтор очереди" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></svg><span aria-hidden="true">1</span></button></div><div class="shell-timeline"><span id="player-position">0:00</span><input id="player-seek" type="range" min="0" max="1" value="0" step=".1" aria-label="Позиция трека"><span id="player-duration">0:00</span></div></div><div class="shell-player-tools"><button id="player-download" title="Установить песню · сохранить MP3" aria-label="Установить песню" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg></button><button id="player-lyrics" title="Текст песни" aria-label="Текст песни"><span class="shell-text-icon" aria-hidden="true">Т</span></button><label class="shell-volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3zm13-2a7 7 0 0 1 0 10v-2a5 5 0 0 0 0-6z"/></svg><input id="player-volume" type="range" min="0" max="100" value="100" aria-label="Громкость"><output id="player-volume-label">100%</output></label></div></footer>
<script src="lib/js/artwork.js"></script><script src="lib/js/track-colors.js"></script><script src="lib/js/track-visuals.js"></script><script src="lib/js/wave-view.js"></script><script src="lib/js/range-controls.js"></script><script src="lib/js/host.js"></script><script src="lib/js/lolzteam.js"></script><script src="lib/js/lyrics-view.js"></script><script src="lib/js/features.js"></script><script src="../plugins/tempo-worklet.js"></script><script src="../plugins/normalization-worklet.js"></script><script src="lib/js/local-player.js"></script><script src="lib/js/player-tools.js"></script><script src="lib/js/app-updates.js"></script></body></html>
