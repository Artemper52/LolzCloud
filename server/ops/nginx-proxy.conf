# Include inside the HTTPS server block for lolzcloud.com.
# An add_header here prevents inheritance of the static landing page CSP;
# the backend sets the stricter page-specific CSP and all remaining headers.
location ~ ^/(?:api/|auth/|cloud/|room/|remote/|login$|rooms$|connect$) {
    proxy_pass http://127.0.0.1:4387;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 20s;
    proxy_cache off;
    proxy_buffering off;
    client_max_body_size 1050k;
    add_header X-Content-Type-Options nosniff always;
}
