# The plan lives in YAML comments, never in an Actions expression or shell code.
# ARTIFACT_PLAN_JSON: {"owner":"Artemper52","repo":"LolzCloud","tag":"v0.9.21","commit":"7577990efd3f9987321cadae68098096c6f95029","notes":"# LolzCloud 0.9.21\n\nКомната получает собственное управление музыкой: системные Play/Pause/Next обращаются к текущей комнате с учётом роли, а поздняя команда или выход не запускает прежнюю личную очередь. Слушатель выключает звук у себя; ведущий управляет общей паузой, очередью и позицией. Next использует голову общей очереди. Подготовка трека подтверждается отдельно от завершения команды, поэтому медленный источник не выдаёт преждевременный тайм-аут. [Проверки](https://github.com/Artemper52/LolzCloud/blob/7577990efd3f9987321cadae68098096c6f95029/docs/room-transport-0.9.21.md).\n\nAndroid 0.1.11/code12 сохраняет перемотку, сделанную до завершения подготовки PCM. Проверены оба движка, играющая и остановленная запись, быстрый переход A → B и поздние callbacks. Удаление собственной офлайн-загрузки освобождает файл и сохраняет ссылку каталога; внешние файлы SAF остаются у пользователя. Можно снять импортированный текст и вернуться к автоматическому поиску. [Android](https://github.com/Artemper52/LolzCloud/blob/7577990efd3f9987321cadae68098096c6f95029/docs/android/room-lyrics-0.1.11.md).\n\nМобильный текст читает смещение и пословные метки расширенного LRC. Уже найденный текст сохраняется при обновлении и переключениях; старый кэш отображается без сырых меток, дополнительных запросов и выдуманных времён слов. Текст комнаты в PWA/native iOS использует общий кэш и обработку speed up/slowed с явно обозначенной оценкой по длительности. Импорт MP3 ID3v2.3/v2.4/v1 и FLAC сохраняет название и исполнителя. [PWA](https://github.com/Artemper52/LolzCloud/blob/7577990efd3f9987321cadae68098096c6f95029/docs/ios-pwa-verification-0.9.21.md).\n\nНа ПК облачная копия привязана к аккаунту, сессии, ревизии и прочитанному конверту. Смена аккаунта во время запроса, расшифровки или подтверждения отменяет применение старого результата. Перед восстановлением копия перечитывается; конфликт не запускает повторную запись.\n\niOS 0.1.6/build7 собран из точного commit `55e3ac9700ce8e9330b5c190746f3fd6544f16cd`: 102 policy-теста и по 20/20 hosted-тестов на iPhone/iPad Simulator, без пропусков. Добавлены владение системными командами, безопасный переход WebKit → офлайн, общая офлайн-очередь и настоящие музыкальные теги. IPA неподписанный; бесплатная установка PWA доступна через Safari. [Apple SDK/runtime](https://github.com/Artemper52/LolzCloud/blob/7577990efd3f9987321cadae68098096c6f95029/docs/ios-runtime-0.1.6-verification.json).\n\nWindows Modern/Legacy прошли запуск; настоящий изолированный Setup 0.9.20 → 0.9.21 сохранил профиль. Linux x64 tar/FUSE AppImage прошли запуск, системный keyring и sandbox; ARM64 проверен статически. Node: 564/564 на Linux, 548/564 на Windows с 16 проверками Linux, выполняемыми на Linux. Физические телефоны, Windows 7, ARM64 runtime и внешний аудиовыход этими проверками не подтверждаются. [Windows](https://github.com/Artemper52/LolzCloud/blob/7577990efd3f9987321cadae68098096c6f95029/docs/windows-verification-0.9.21.md) · [Linux](https://github.com/Artemper52/LolzCloud/blob/7577990efd3f9987321cadae68098096c6f95029/docs/linux-verification-0.9.21.md).\n\nNative 0.1.6: https://github.com/Artemper52/LolzCloud/actions/runs/43736437440\nSource commit: 7577990efd3f9987321cadae68098096c6f95029\n","files":[{"name":"android-update.json","url":"https://lolzcloud.com/downloads/android-update.json","size":441,"sha256":"086a8f14cbcf1bdb891f0571bf79cc0b6de5ac82bda43a64ecce0f8e7a0b4435"},{"name":"latest.yml","url":"https://lolzcloud.com/downloads/latest.yml","size":366,"sha256":"7e6a73f07f587703c6aa4ddc622ca93db92c19061b9b06c6fa1f2c652ecdf2a8"},{"name":"legacy.yml","url":"https://lolzcloud.com/downloads/legacy.yml","size":373,"sha256":"5b6ba1b9c5a97db8279686b67fd655f7f2fb369a2705b0095f824f6b9120bec5"},{"name":"LolzCloud-0.9.21-linux-arm64.tar.gz","url":"https://lolzcloud.com/downloads/LolzCloud-0.9.21-linux-arm