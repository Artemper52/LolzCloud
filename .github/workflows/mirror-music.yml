# ARTIFACT_PLAN_SHA256: 75f10d93dd4f986dec234942abc4a37ceb809bcc38ce48f1b53b8e0f19b6abc6
name: Mirror verified LolzCloud 0.9.19 artifacts
run-name: Mirror reviewed 0.9.19 artifacts (${{ github.sha }})
on:
  push:
    branches: [codex/recover-music-0.9.19]
    paths: [.github/workflows/mirror-music.yml]
permissions: {}
concurrency:
  group: lolzcloud-release-0.9.19-verified-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'Artemper52/LolzCloud' && github.ref == 'refs/heads/codex/recover-music-0.9.19' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
