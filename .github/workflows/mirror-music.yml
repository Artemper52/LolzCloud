си зависит от источника; результаты проверок не означают отсутствия всех возможных ошибок.\n\nNative runtime: https://github.com/Artemper52/LolzCloud/actions/runs/43661428085\nSource commit: a98eef6f2ef1403cc621c99fa82ae6398c5ed440\n","files":[{"name":"android-update.json","url":"https://lolzcloud.com/downloads/android-update.json","size":439,"sha256":"113448605b2bc85fd488c859f2f1b2799e89604a805e7de2b6aad54229b7f255"},{"name":"latest.yml","url":"https://lolzcloud.com/downloads/latest.yml","size":366,"sha256":"276225683f6d8e64edee821e78bc40531f70b89a3b7a31a94b3f88a2f6cda65c"},{"name":"legacy.yml","url":"https://lolzcloud.com/downloads/legacy.yml","size":373,"sha256":"d78635bec0503dd92147b6e4b064836581cbae46df120222c444980f67e2f468"},{"name":"LolzCloud-0.9.19-linux-arm64.tar.gz","url":"https://lolzcloud.com/downloads/LolzCloud-0.9.19-linux-arm64.tar.gz","size":159411964,"sha256":"e03a093c2e436f932666fbfa7d417211da2e9e67d6da69df608b5ae4bb7c37f9"},{"name":"LolzCloud-0.9.19-linux-x64.AppImage","url":"https://lolzcloud.com/downloads/LolzCloud-0.9.19-linux-x64.AppImage","size":147470840,"sha256":"2e4f1e49d234dc310869b719acce1e05b2b2730271aa4f84755ce8f6b4e6bd98"},{"name":"LolzCloud-0.9.19-linux-x64.tar.gz","url":"https://lolzcloud.com/downloads/LolzCloud-0.9.19-linux-x64.tar.gz","size":160325692,"sha256":"17affd53051995f994e1103a650e47b619e021a7f6569abbba05719e8ca3d541"},{"name":"LolzCloud-0.9.19-source.zip","url":"https://lolzcloud.com/downloads/LolzCloud-0.9.19-source.zip","size":26944551,"sha256":"d5b9efc1c8862cb633ca02789d51bdd5f708e03deb952404c38b9fac139843ad"},{"name":"LolzCloud-0.9.19-win-x64-Setup.exe","url":"https://lolzcloud.com/downloads/LolzCloud-0.9.19-win-x64-Setup.exe","size":146396374,"sha256":"eca24d822cfbff7e7891a0c958ca6bff91cff3718766e3b7a5b93fcf8406007f"},{"name":"LolzCloud-0.9.19-win-x64-Setup.exe.blockmap","url":"https://lolzcloud.com/downloads/LolzCloud-0.9.19-win-x64-Setup.exe.blockmap","size":152714,"sha256":"294da34c65f6e28bbbaa0eaa9f4fc4c4570b2c4