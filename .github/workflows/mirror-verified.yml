            const plans = lines.filter(line => line.startsWith(p)), hashes = lines.filter(line => line.startsWith(h));
            ensure(plans.length === 1 && hashes.length === 1, 'Exactly one embedded plan and plan SHA are required');
            const raw = plans[0].slice(p.length), expected = hashes[0].slice(h.length);
