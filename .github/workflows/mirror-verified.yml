# ARTIFACT_PLAN_SHA256: e8511de9f70f8147900d6f2985f9e646ecd0e4af56bd61a491be82c691d45e61
name: Mirror verified LolzCloud 0.9.15 artifacts
run-name: Mirror reviewed 0.9.15 artifacts (${{ github.sha }})
on:
  push:
    branches: [codex/recover-platforms-0.9.15]
    paths: [.github/workflows/mirror-verified.yml]
permissions: {}
concurrency:
  group: lolzcloud-release-0.9.15-verified-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'Artemper52/LolzCloud' && github.ref == 'refs/heads/codex/recover-platforms-0.9.15' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Download, verify every byte, reconcile assets, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: github.com
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          GH_DEBUG: ''
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/lolzcloud-verified-mirror.cjs" <<'NODE'
          'use strict';
          const fs = require('node:fs'), path = require('node:path'), https = require('node:https');
          const { createHash } = require('node:crypto'), { spawn } = require('node:child_process');
          const { pipeline } = require('node:stream/promises'), { Transform } = require('node:stream');
          const REPOSITORY = 'Artemper52/LolzCloud';
          const BRANCH = 'refs/heads/codex/recover-platforms-0.9.15';
          const WORKFLOW = '.github/workflows/mirror-verified.yml';
          const MAX_FILE = 350_000_000, MAX_TOTAL = 2_000_000_000, MAX_FILES = 32;
          const USER_AGENT = 'LolzCloud-ReleaseVerification/0.9.15 (+https://github.com/Artemper52/LolzCloud)';
          const SHA = /^[a-f0-9]{64}$/, COMMIT = /^[a-f0-9]{40}$/;
          const NAME = /^[A-Za-z0-9][A-Za-z0-9._-]{0,179}$/;
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          function ensure(value, message) { if (!value) throw new Error(message); }
          function validatePlan(plan) {
            ensure(plan && typeof plan === 'object' && !Array.isArray(plan), 'Plan must be an object');
            ensure(Object.keys(plan).every(key => ['owner','repo','tag','commit','notes','files'].includes(key)), 'Unexpected plan field');
            ensure(plan.owner === 'Artemper52' && plan.repo === 'LolzCloud', 'Wrong target repository');
            ensure(plan.tag === 'v0.9.15' && COMMIT.test(plan.commit), 'Wrong tag or non-pinned commit');
            ensure(typeof plan.notes === 'string' && Buffer.byteLength(plan.notes) <= 50_000 && !plan.notes.includes('\0'), 'Invalid release notes');
            ensure(Array.isArray(plan.files) && plan.files.length > 0 && plan.files.length <= MAX_FILES, 'Invalid file count');
