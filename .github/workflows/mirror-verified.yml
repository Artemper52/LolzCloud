              let existing = release ? await assetsFor(release, plan) : [];
              report.stage = 'download-and-hash-official'; save();
              await parallelThree(plan.files, async (file, signal) => { const actual = await downloadOfficial(file, path.join(source, file.name), signal); report.sourceChecks.push({ name: file.name, url: file.url, expectedSize: file.size, expectedSha256: file.sha256, actualSize: actual.size, actualSha256: actual.sha256, passed: true }); save(); console.log('Verified official artifact: ' + file.name + ' (' + actual.size + ' bytes)'); });
              ensure(report.sourceChecks.length === plan.files.length, 'Not all source artifacts were verified');
              async function verifyExisting(assets) {
                await parallelThree(assets, async (asset, signal) => {
                  const file = plan.files.find(item => item.name === asset.name), earlier = checked.get(asset.name);
                  if (earlier) { ensure(earlier.id === asset.id && earlier.size === asset.size, 'An already verified GitHub asset changed'); return; }
                  const destination = path.join(remote, file.name);
                  await gh(['release','download',plan.tag,'--repo',REPOSITORY,'--pattern',file.name,'--output',destination], { output: destination, size: file.size, signal });
                  const actual = await hashFile(destination, file); checked.set(file.name, { id: asset.id, size: actual.size, sha256: actual.sha256 });
                  report.githubChecks.push({ name: file.name, assetId: asset.id, expectedSize: file.size, expectedSha256: file.sha256, actualSize: actual.size, actualSha256: actual.sha256, passed: true }); save();
                });
              }
              report.stage = 'verify-preexisting-github-assets'; save(); await verifyExisting(existing);
              if (release?.immutable) ensure(existing.length === plan.files.length, 'Immutable release is missing planned assets; refusing uploads');
              const observedTag = await verifyTag(plan, tag, !tag);
              if (!observedTag) {
                // The only ref write is an absent, fixed release tag, after ALL
                // official and preexisting GitHub bytes have passed hashing.
                report.stage = 'create-missing-tag-after-all-hashes'; save();
                const created = await createMissingTag(plan);
                if (created.status === 201) {
                  report.mutations.push({ action: 'created-missing-tag', ref: 'refs/tags/v0.9.15', commit: plan.commit }); save();
                  tag = await verifyTag(plan, { refSha: plan.commit, commit: plan.commit });
                } else {
                  // 422 is not assumed to be success: a concurrent existing ref
                  // must independently resolve to exactly the reviewed commit.
                  report.tagCreation = 'concurrent-422-rechecked'; save(); tag = await verifyTag(plan);
                }
              } else tag = observedTag;
              report.tagResolution = tag; save();
              // Draft creation also waits for the byte checks and exact tag.
              if (!release) {
                report.stage = 'create-draft-after-all-hashes'; save();
                const notes = path.join(root, 'release-notes.md'); fs.writeFileSync(notes, plan.notes, 'utf8');
                await gh(['release','create',plan.tag,'--repo',REPOSITORY,'--verify-tag','--draft','--latest=false','--title','LolzCloud 0.9.15','--notes-file',notes]);
                release = await findRelease(plan.tag); ensure(release && release.draft, 'Created draft is not discoverable'); report.mutations.push({ action: 'created-draft', releaseId: release.id }); save();
              }
              const releaseId = release.id;
              async function confirmReleaseIdentity() {
                const found = await findRelease(plan.tag); ensure(found?.id === releaseId, 'Release identity changed before a write');
                ensure(!found.prerelease, 'Release changed to prerelease'); return found;
              }
              for (const file of plan.files) {
                release = await confirmReleaseIdentity(); existing = await assetsFor(release, plan); await verifyExisting(existing);
                if (existing.some(asset => asset.name === file.name)) continue;
                ensure(!release.immutable, 'Refusing to mutate an immutable release'); await verifyTag(plan, tag);
                await hashFile(path.join(source, file.name), file); report.stage = 'upload-missing-assets'; save();
                // Deliberately NO --clobber. A concurrent same-name upload fails.
                await gh(['release','upload',plan.tag,path.join(source,file.name),'--repo',REPOSITORY]); report.mutations.push({ action: 'uploaded-missing-asset', name: file.name }); save();
              }
              report.stage = 'verify-final-github-asset-set'; save();
              const current = await findRelease(plan.tag); ensure(current?.id === releaseId, 'Release identity changed'); release = current;
              existing = await assetsFor(release, plan); ensure(existing.length === plan.files.length, 'Final asset set is incomplete'); await verifyExisting(existing);
              ensure(checked.size === plan.files.length, 'Not every GitHub asset has actual verified bytes'); await verifyTag(plan, tag);
              await confirmReleaseIdentity();
              report.stage = 'publish-and-mark-latest'; save();
              await gh(['release','edit',plan.tag,'--repo',REPOSITORY,'--draft=false','--latest']); report.mutations.push({ action: 'published-latest', releaseId });
              const published = await findRelease(plan.tag), latest = await api('/repos/' + REPOSITORY + '/releases/latest');
              ensure(published?.id === releaseId && !published.draft && !published.prerelease && latest.status === 200 && latest.value.id === releaseId, 'Publication/latest confirmation failed');
              await verifyTag(plan, tag); report.release = { id: releaseId, url: published.html_url, draft: false, latest: true }; report.status = 'passed'; report.stage = 'complete';
              fs.writeFileSync(path.join(reports, 'actual-SHA256SUMS.txt'), plan.files.map(file => checked.get(file.name).sha256 + '  ' + file.name).join('\n') + '\n');
            } catch (error) { report.error = String(error.message || error).replace(/[\r\n]/g,' ').slice(0,500); throw error; }
            finally {
              report.finishedAt = new Date().toISOString(); save();
              if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## LolzCloud verified artifact mirror\n\nStatus: **' + report.status + '** · stage: `' + report.stage + '`\n\nPlan SHA-256: `' + (report.planSha256 || 'not accepted') + '`\n\n| Artifact | Actual bytes | Actual SHA-256 |\n| --- | ---: | --- |\n' + report.sourceChecks.map(file => '| ' + file.name + ' | ' + file.actualSize + ' | `' + file.actualSha256 + '` |').join('\n') + '\n\nSee the verification artifact for GitHub asset byte hashes and any partial draft state.\n');
            }
          }
          if (process.env.LOLZCLOUD_TEMPLATE_TEST === '1') module.exports = { validatePlan, decodePinnedPlan, parallelThree, downloadOfficial, main };
          else main().catch(error => { console.error('Verified mirror stopped: ' + String(error.message || error).replace(/[\r\n]/g,' ').slice(0,500)); process.exitCode = 1; });
          NODE
          node "$RUNNER_TEMP/lolzcloud-verified-mirror.cjs"
      - name: Preserve actual checksum reports even on a failed mirror
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, official action
        with:
          name: lolzcloud-0.9.15-verified-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lolzcloud-mirror-reports/
          if-no-files-found: error
          retention-days: 14
