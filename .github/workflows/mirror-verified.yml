              if (response.statusCode !== 200 || response.headers.location) { response.destroy(); throw new Error('Official mirror HTTP ' + response.statusCode + ': ' + file.name); }
              const advertised = response.headers['content-length'], encoding = response.headers['content-encoding'];
              if (advertised !== undefined && (!/^\d+$/.test(advertised) || Number(advertised) !== file.size) || encoding && encoding !== 'identity') { response.destroy(); throw new Error('Unexpected mirror response size/encoding: ' + file.name); }
              let bytes = 0; const hash = createHash('sha256');
              const verify = new Transform({ transform(chunk, _encoding, callback) { bytes += chunk.length; if (bytes > file.size) return callback(new Error('Mirror exceeded pinned size: ' + file.name)); hash.update(chunk); callback(null, chunk); } });
              await pipeline(response, verify, fs.createWriteStream(destination, { flags: 'wx', mode: 0o600 }), { signal: controller.signal });
              const actual = hash.digest('hex'); ensure(bytes === file.size && actual === file.sha256, 'Mirror bytes/hash mismatch: ' + file.name);
              fs.chmodSync(destination, 0o400); return { size: bytes, sha256: actual };
            } finally { clearTimeout(deadline); signal.removeEventListener('abort', abort); }
          }
          async function api(endpoint) {
            ensure(endpoint.startsWith('/repos/' + REPOSITORY + '/'), 'API endpoint escaped the fixed repository');
            return new Promise((resolve, reject) => {
              const request = https.get({ hostname: 'api.github.com', path: endpoint, headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'User-Agent': USER_AGENT, 'X-GitHub-Api-Version': '2022-11-28' } }, response => {
                if (![200,404].includes(response.statusCode) || response.headers.location) { response.destroy(); reject(new Error('GitHub read API HTTP ' + response.statusCode)); return; }
                let bytes = 0; const parts = [];
                response.on('data', chunk => { bytes += chunk.length; if (bytes > 2_000_000) { response.destroy(new Error('GitHub API response exceeded its limit')); return; } parts.push(chunk); });
                response.on('error', reject); response.on('end', () => { try { resolve({ status: response.statusCode, value: JSON.parse(Buffer.concat(parts).toString('utf8')) }); } catch { reject(new Error('Invalid GitHub JSON response')); } });
              });
              request.setTimeout(30_000, () => request.destroy(new Error('GitHub API timeout'))); request.on('error', reject);
            });
          }
          async function createMissingTag(plan) {
            ensure(plan.tag === 'v0.9.15' && COMMIT.test(plan.commit), 'Only the reviewed v0.9.15 tag may be created');
            const body = Buffer.from(JSON.stringify({ ref: 'refs/tags/v0.9.15', sha: plan.commit }), 'utf8');
            return new Promise((resolve, reject) => {
              const request = https.request({ hostname: 'api.github.com', path: '/repos/' + REPOSITORY + '/git/refs', method: 'POST', headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'User-Agent': USER_AGENT, 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json', 'Content-Length': body.length } }, response => {
                // Location on 201 identifies the new ref; only 3xx is a redirect.
                if (![201,422].includes(response.statusCode)) { response.destroy(); reject(new Error('GitHub tag creation HTTP ' + response.statusCode)); return; }
                let bytes = 0; const parts = [];
                response.on('data', chunk => { bytes += chunk.length; if (bytes > 2_000_000) { response.destroy(new Error('GitHub tag response exceeded its limit')); return; } parts.push(chunk); });
                response.on('error', reject); response.on('end', () => { try { resolve({ status: response.statusCode, value: JSON.parse(Buffer.concat(parts).toString('utf8')) }); } catch { reject(new Error('Invalid GitHub tag JSON response')); } });
              });
              request.setTimeout(30_000, () => request.destroy(new Error('GitHub tag creation timeout'))); request.on('error', reject); request.end(body);
            });
          }
          async function verifyTag(plan, previous, allowMissing = false) {
            const ref = await api('/repos/' + REPOSITORY + '/git/ref/tags/' + encodeURIComponent(plan.tag));
            if (ref.status === 404) { ensure(allowMissing && !previous, 'Reviewed tag is missing or disappeared'); return null; }
            ensure(ref.status === 200 && ref.value.ref === 'refs/tags/' + plan.tag, 'Unexpected reviewed tag identity');
            const refSha = ref.value.object?.sha; let object = ref.value.object; const seen = new Set();
            for (let depth = 0; object?.type === 'tag' && depth < 6; depth++) {
              ensure(COMMIT.test(object.sha) && !seen.has(object.sha), 'Invalid or cyclic annotated tag'); seen.add(object.sha);
              const annotated = await api('/repos/' + REPOSITORY + '/git/tags/' + object.sha); ensure(annotated.status === 200, 'Cannot resolve annotated tag'); object = annotated.value.object;
            }
            ensure(object?.type === 'commit' && object.sha === plan.commit, 'Tag does not resolve to the reviewed commit');
            if (previous) ensure(previous.refSha === refSha && previous.commit === object.sha, 'Tag changed during verification');
            return { refSha, commit: object.sha };
          }
          async function findRelease(tag) {
            const found = [];
            // Listing also discovers authenticated draft releases, unlike relying
            // on published-release-by-tag behavior alone.
