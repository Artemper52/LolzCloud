            const response = await api('/repos/' + REPOSITORY + '/releases/' + release.id + '/assets?per_page=100');
            ensure(response.status === 200 && Array.isArray(response.value) && response.value.length <= MAX_FILES, 'Invalid or excessive release assets');
            const expected = new Map(plan.files.map(file => [file.name, file])), seen = new Set();
