              // pinned byte count plus at most one 1024-byte block.
              const executable = output ? 'bash' : 'gh';
              const argv = output ? ['-c', 'ulimit -c 0; ulimit -f "$1"; shift; exec "$@"', 'bounded-gh', String(Math.ceil(size / 1024)), 'gh', ...args] : args;
              const child = spawn(executable, argv, { stdio: ['ignore','ignore','ignore'], env: { ...process.env, GH_HOST: 'github.com', GH_DEBUG: '', GH_PROMPT_DISABLED: '1', GH_NO_UPDATE_NOTIFIER: '1' } });
              let settled = false;
              const stop = () => child.kill('SIGTERM'); signal?.addEventListener('abort', stop, { once: true });
              const timer = setTimeout(() => child.kill('SIGKILL'), 300_000);
              const finish = error => { if (settled) return; settled = true; clearTimeout(timer); signal?.removeEventListener('abort', stop); error ? reject(error) : resolve(); };
              child.on('error', () => finish(new Error('Unable to start GitHub CLI')));
              child.on('close', (code, killed) => finish(code === 0 ? null : new Error('GitHub CLI ' + args.slice(0,2).join(' ') + ' failed (' + (killed || code) + ')')));
            });
          }
          async function main() {
            const temp = process.env.RUNNER_TEMP; ensure(temp && path.isAbsolute(temp), 'RUNNER_TEMP is required');
            const reports = path.join(temp, 'lolzcloud-mirror-reports'); fs.mkdirSync(reports, { recursive: true });
            const report = { status: 'failed', stage: 'validate-context', runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, workflowCommit: process.env.GITHUB_SHA, sourceChecks: [], githubChecks: [], mutations: [] };
            const save = () => fs.writeFileSync(path.join(reports, 'verification.json'), JSON.stringify(report, null, 2) + '\n');
            const checked = new Map(); let plan, root;
            try {
              ensure(process.env.GITHUB_REPOSITORY === REPOSITORY && process.env.GITHUB_REF === BRANCH && process.env.GITHUB_EVENT_NAME === 'push' && COMMIT.test(process.env.GITHUB_SHA || ''), 'Unexpected repository/branch/event/commit');
