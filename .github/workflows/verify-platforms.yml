name: Verify current platform source
'on':
  push:
    branches: ['codex/recover-platforms-0.9.15']
    paths: ['ios/**', '.github/workflows/verify-platforms.yml', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recover-platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the imported source ancestry and version
        id: commit
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/codex/recover-platforms-0.9.15
          git merge-base --is-ancestor ff444731b11039e11f5a700d3d69a92617c1abd8 HEAD
          test "$(node -p 'require("./package.json").version')" = 0.9.15
          printf 'ref=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  apple-sdk:
    needs: source
    uses: ./.github/workflows/ios.yml
    with:
      source_ref: ${{ needs.source.outputs.ref }}
