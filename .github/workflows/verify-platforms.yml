name: Verify current platform source
'on':
  push:
    branches: ['codex/recover-platforms-0.9.15']
    paths: ['.github/workflows/verify-platforms.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recover-platforms-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import the verified source snapshot
        env:
          SNAPSHOT_NAME: 'LolzCloud-0.9.15-r2-candidate-source.zip'
          SNAPSHOT_SHA256: '377033c6bd7d8be2a1c3efee7b8d57441a2a2eebcab1a6bb563f53290ce49d93'
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, re, stat, urllib.request, zipfile
          from pathlib import Path
          name, expected = os.environ['SNAPSHOT_NAME'], os.environ['SNAPSHOT_SHA256']
          assert re.fullmatch(r'LolzCloud-[A-Za-z0-9_.-]+-source\.zip', name)
          assert re.fullmatch(r'[a-f0-9]{64}', expected)
          url = 'https://lolzcloud.com/downloads/' + name
          class NoRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirects())
          request = urllib.request.Request(url, headers={'User-Agent':'LolzCloud-ReleaseVerification/0.9.15 (+https://github.com/Artemper52/LolzCloud)','Accept':'application/zip'})
          with opener.open(request, timeout=60) as response:
              assert response.geturl() == url
              content = response.read(64 * 1024 * 1024 + 1)
          assert len(content) <= 64 * 1024 * 1024
          assert hashlib.sha256(content).hexdigest() == expected
          root = Path.cwd().resolve()
          roots = {'.gitattributes','.gitignore','.github','package.json','package-lock.json','README.md','LICENSE','THIRD_PARTY_NOTICES.md','CONTRIBUTING.md','source','tests','tools','config','docs','licenses','server','telegram','music','android','ios','website'}
          with zipfile.ZipFile(io.BytesIO(content)) as archive:
              entries = archive.infolist()
              assert len(entries) <= 5000 and sum(e.file_size for e in entries) <= 300 * 1024 * 1024
              names = set()
              for entry in entries:
                  relative = Path(entry.filename)
                  assert not relative.is_absolute() and relative.parts and relative.parts[0] in roots
                  assert all(p not in ('.','..') for p in relative.parts)
                  assert ':' not in entry.filename and '\\' not in entry.filename and '\0' not in entry.filename
                  assert entry.filename not in names and entry.file_size <= 32 * 1024 * 1024
                  names.add(entry.filename)
                  mode = entry.external_attr >> 16
                  assert not stat.S_ISLNK(mode) and stat.S_IFMT(mode) in (0, stat.S_IFREG, stat.S_IFDIR)
                  target = root / relative
                  assert target.resolve().is_relative_to(root)
                  if entry.is_dir():
                      continue
                  payload = archive.read(entry)
                  if relative.parts[0] == '.github':
                      assert target.is_file() and target.read_bytes().replace(b'\r\n',b'\n') == payload.replace(b'\r\n',b'\n'), str(relative)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload)
          assert json.loads((root/'package.json').read_text())['version'] == '0.9.15'
          assert (root/'ios/LolzCloud/NativePlayer.swift').is_file()
          print(json.dumps({'snapshot':name,'sha256':expected,'files':len(names),'workflows':'already committed through owner connection'}))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Retain the source in the review branch
        id: commit
        shell: bash
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/codex/recover-platforms-0.9.15
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github'
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified LolzCloud 0.9.15 platform source'
            git push origin HEAD:refs/heads/codex/recover-platforms-0.9.15
          fi
          printf 'ref=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  apple-sdk:
    needs: source
    uses: ./.github/workflows/ios.yml
    with:
      source_ref: ${{ needs.source.outputs.ref }}
